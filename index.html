<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Food Score — $ per 2,000 cal</title>
<style>
  :root {
    --row-h: 2.5rem;
    --bg: #f2f2f7; --card: #ffffff; --text: #1c1c1e; --muted: #8e8e93;
    --pill: rgba(120,120,128,.12); --accent: #007aff;
    --green: #34c759; --orange: #ff9500; --red: #ff3b30;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --card: #1c1c1e; --text: #ffffff; --muted: #98989f;
      --pill: rgba(120,120,128,.24); --accent: #0a84ff;
    }
  }
  @media (max-height: 640px) { :root { --row-h: 2.1rem; } }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    max-width: 430px; height: 100%; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 1.5rem) 1rem calc(env(safe-area-inset-bottom) + 1rem);
    display: flex; flex-direction: column; gap: 1.5rem;
    overflow-y: auto;
  }
  /* center when content fits, scroll cleanly when it doesn't */
  main > :first-child { margin-top: auto; }
  main > :last-child { margin-bottom: auto; }

  /* ---------- result ---------- */
  .result { text-align: center; }
  #cost {
    font-size: clamp(3rem, 18vw, 4.5rem); font-weight: 700; line-height: 1.05;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
    transition: color .15s ease;
  }
  #cost.long { font-size: clamp(2.2rem, 13vw, 3.4rem); }
  main[data-zone="green"]  #cost, main[data-zone="green"]  .thumb { color: var(--green); }
  main[data-zone="orange"] #cost, main[data-zone="orange"] .thumb { color: var(--orange); }
  main[data-zone="red"]    #cost, main[data-zone="red"]    .thumb { color: var(--red); }
  .sub { color: var(--muted); font-size: .85rem; margin-top: .3rem; font-variant-numeric: tabular-nums; }

  /* ---------- bar ---------- */
  .bar { margin-top: 1.1rem; padding: 0 .25rem; }
  .track {
    position: relative; height: .7rem; border-radius: 999px;
    background: linear-gradient(90deg,
      var(--green) 0%, var(--green) 20%, var(--orange) 30%,
      var(--orange) 74%, var(--red) 86%, var(--red) 100%);
  }
  .cover {
    position: absolute; top: 0; right: 0; bottom: 0; width: 100%;
    background: var(--bg); opacity: .82;
    border-radius: 0 999px 999px 0;
    transition: width .12s ease-out;
  }
  .thumb {
    position: absolute; top: -4px; bottom: -4px; left: 0; width: 5px;
    border-radius: 3px; background: currentColor; color: var(--muted);
    box-shadow: 0 0 0 2px var(--bg);
    transform: translateX(-50%);
    transition: left .12s ease-out, color .15s ease;
  }
  .ticks { position: relative; height: 1rem; margin-top: .35rem; font-size: .65rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ticks span { position: absolute; top: 0; transform: translateX(-50%); }
  .ticks .t0   { left: 0; transform: none; }
  .ticks .t250 { left: 25%; }
  .ticks .t800 { left: 80%; }
  .ticks .tmax { right: 0; transform: none; }

  /* ---------- pickers ---------- */
  .pickers {
    background: var(--card); border-radius: 1.25rem;
    padding: 1rem .6rem 1.1rem;
    display: grid; grid-template-columns: 1fr 1.15fr 1.75fr; gap: .3rem;
  }
  .col label {
    display: block; text-align: center; margin-bottom: .6rem;
    font-size: .65rem; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
  }
  .pricerow { display: flex; align-items: center; }
  .pricerow .wheelbox { flex: 1; min-width: 0; }
  .sym { color: var(--muted); font-weight: 600; font-size: 1.1rem; padding: 0 .05rem; }

  .wheelbox { position: relative; }
  .pill {
    position: absolute; left: 1px; right: 1px; top: 50%; height: var(--row-h);
    transform: translateY(-50%); background: var(--pill);
    border-radius: .6rem; pointer-events: none;
  }
  .wheel {
    position: relative; height: calc(var(--row-h) * 5);
    overflow-y: scroll; scroll-snap-type: y mandatory;
    padding: calc(var(--row-h) * 2) 0;
    scrollbar-width: none; overscroll-behavior: contain; touch-action: pan-y;
    -webkit-mask-image: linear-gradient(transparent, #000 28%, #000 72%, transparent);
    mask-image: linear-gradient(transparent, #000 28%, #000 72%, transparent);
  }
  .wheel::-webkit-scrollbar { display: none; }
  .item {
    height: var(--row-h); display: flex; align-items: center; justify-content: center;
    scroll-snap-align: center;
    font-size: 1.3rem; color: var(--muted); font-variant-numeric: tabular-nums;
    cursor: pointer; user-select: none; -webkit-user-select: none;
  }
  .item.sel { color: var(--text); font-weight: 600; }

  /* ---------- macro section ---------- */
  .pickers.macro { grid-template-columns: repeat(3, 1fr); }
  .macro .mresult, .macro .msliders { grid-column: 1 / -1; }
  .macro .mprice { grid-column: span 2; }
  .macro .row2 { margin-top: .5rem; }
  .mresult { text-align: center; margin-bottom: .8rem; }
  #mcost {
    font-size: 1.9rem; font-weight: 700; line-height: 1.1;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
    transition: color .15s ease;
  }
  .msliders { display: flex; flex-direction: column; gap: .45rem; margin-top: 1rem; padding: 0 .5rem; }
  .srow {
    display: flex; align-items: center; gap: .6rem;
    font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .srow .lab { width: 8rem; flex: none; }
  .srow .lab b { color: var(--text); font-weight: 600; }
  .srow input { flex: 1; min-width: 0; accent-color: var(--accent); }

  .editor {
    position: absolute; left: 2px; right: 2px; top: 50%; height: var(--row-h);
    transform: translateY(-50%); z-index: 2;
    text-align: center; font: inherit; font-size: 1.3rem; font-weight: 600;
    font-variant-numeric: tabular-nums; color: var(--text);
    background: var(--card); border: 2px solid var(--accent);
    border-radius: .6rem; outline: none; width: auto; min-width: 0; padding: 0;
  }
</style>
</head>
<body>
<main id="app" data-zone="orange">
  <header class="result">
    <div id="cost">$—</div>
    <div class="sub" id="sub">per 2,000 cal</div>
    <div class="bar">
      <div class="track">
        <div class="cover" id="cover"></div>
        <div class="thumb" id="thumb"></div>
      </div>
      <div class="ticks">
        <span class="t0">$0</span><span class="t250">$2.50</span><span class="t800">$8</span><span class="tmax">$10+</span>
      </div>
    </div>
  </header>

  <section class="pickers">
    <div class="col">
      <label>Servings</label>
      <div class="wheelbox"><div class="pill"></div><div class="wheel" id="w-serv"></div></div>
    </div>
    <div class="col">
      <label>Calories</label>
      <div class="wheelbox"><div class="pill"></div><div class="wheel" id="w-cal"></div></div>
    </div>
    <div class="col">
      <label>Price</label>
      <div class="pricerow">
        <span class="sym">$</span>
        <div class="wheelbox"><div class="pill"></div><div class="wheel" id="w-dol"></div></div>
        <span class="sym">.</span>
        <div class="wheelbox"><div class="pill"></div><div class="wheel" id="w-cen"></div></div>
      </div>
    </div>
  </section>

  <section class="pickers macro">
    <div class="mresult">
      <div id="mcost">$—</div>
      <div class="sub" id="msub">per 2,000 useful cal</div>
    </div>
    <div class="col">
      <label>Protein g</label>
      <div class="wheelbox"><div class="pill"></div><div class="wheel" id="w-pro"></div></div>
    </div>
    <div class="col">
      <label>Carbs g</label>
      <div class="wheelbox"><div class="pill"></div><div class="wheel" id="w-carb"></div></div>
    </div>
    <div class="col">
      <label>Fat g</label>
      <div class="wheelbox"><div class="pill"></div><div class="wheel" id="w-fat"></div></div>
    </div>
    <div class="col row2">
      <label>Servings</label>
      <div class="wheelbox"><div class="pill"></div><div class="wheel" id="w-mserv"></div></div>
    </div>
    <div class="col row2 mprice">
      <label>Price</label>
      <div class="pricerow">
        <span class="sym">$</span>
        <div class="wheelbox"><div class="pill"></div><div class="wheel" id="w-mdol"></div></div>
        <span class="sym">.</span>
        <div class="wheelbox"><div class="pill"></div><div class="wheel" id="w-mcen"></div></div>
      </div>
    </div>
    <div class="msliders">
      <div class="srow"><span class="lab">Protein <b id="l-p">30%</b> · <span id="g-p">150g</span></span><input type="range" id="s-p" min="0" max="100" step="1" value="30"></div>
      <div class="srow"><span class="lab">Carbs <b id="l-c">35%</b> · <span id="g-c">175g</span></span><input type="range" id="s-c" min="0" max="100" step="1" value="35"></div>
      <div class="srow"><span class="lab">Fat <b id="l-f">35%</b> · <span id="g-f">78g</span></span><input type="range" id="s-f" min="0" max="100" step="1" value="35"></div>
    </div>
  </section>
</main>

<script>
"use strict";
const $ = s => document.querySelector(s);
let touched = false;
addEventListener("pointerdown", () => { touched = true; }, { once: true });

/* ---------- math ---------- */
function costPer2000(servings, calories, dollars, cents) {
  const totalCal = servings * calories;
  if (!(totalCal > 0)) return null;
  return 2000 / totalCal * (dollars + cents / 100);
}

/* Macro score: each macro earns credit up to its proportional share of the
   daily split (food is X% of 2000 cal -> caps at X% of each macro target).
   Excess beyond a cap earns nothing. Scale-invariant in servings. */
function usefulCost(grams, servings, dollars, cents, split) {
  const pcal = grams.p * 4, ccal = grams.c * 4, fcal = grams.f * 9;
  const cal = pcal + ccal + fcal;
  if (!(cal > 0)) return null;
  const useful =
    Math.min(pcal, split.p / 100 * cal) +
    Math.min(ccal, split.c / 100 * cal) +
    Math.min(fcal, split.f / 100 * cal);
  if (!(useful * servings > 0)) return null;
  return {
    cost: (dollars + cents / 100) * 2000 / (useful * servings),
    frac: useful / cal,
    cal,
  };
}

/* ---------- wheel ---------- */
// ponytail: native CSS scroll-snap does momentum/snap; JS only reads position.
function buildWheel(el, opts) {
  const values = [];
  for (let v = opts.min; v <= opts.max; v += opts.step) values.push(v);
  const n = values.length;
  const copies = opts.loop ? 5 : 1; // ponytail: 5 copies + recenter-on-settle beats virtual windowing for 100 rows
  const total = n * copies;
  const fmt = opts.format || String;

  const frag = document.createDocumentFragment();
  for (let i = 0; i < total; i++) {
    const d = document.createElement("div");
    d.className = "item";
    d.textContent = fmt(values[i % n]);
    frag.appendChild(d);
  }
  el.appendChild(frag);
  const items = el.children;
  const rowH = items[0].offsetHeight;

  let curIdx = -1;
  let editor = null;

  const idxFromScroll = () =>
    Math.max(0, Math.min(total - 1, Math.round(el.scrollTop / rowH)));
  const valueAt = i => values[i % n];
  const get = () => valueAt(curIdx >= 0 ? curIdx : idxFromScroll());

  function markSel(i, silent) {
    if (i === curIdx) return;
    if (curIdx >= 0) items[curIdx].classList.remove("sel");
    items[i].classList.add("sel");
    curIdx = i;
    if (!silent) {
      if (touched) navigator.vibrate?.(3);
      opts.onChange?.(valueAt(i));
    }
  }

  function onScroll() {
    if (editor) closeEditor(false);
    markSel(idxFromScroll());
  }

  function settle() {
    let i = idxFromScroll();
    if (opts.loop && (i < n || i >= total - n)) {
      const j = 2 * n + (i % n);
      if (curIdx >= 0) items[curIdx].classList.remove("sel");
      curIdx = -1;
      el.scrollTop = j * rowH; // instant, invisible: same value, same pixel phase
      markSel(j, true);
    } else {
      markSel(i);
    }
  }

  function set(v, smooth) {
    const clamped = Math.max(opts.min, Math.min(opts.max, v));
    const snapped = Math.round((clamped - opts.min) / opts.step) * opts.step + opts.min;
    let i = values.indexOf(snapped);
    if (opts.loop) i += 2 * n;
    if (smooth) el.scrollTo({ top: i * rowH, behavior: "smooth" });
    else el.scrollTop = i * rowH;
    markSel(i);
  }

  /* tap selected value -> type it */
  function openEditor() {
    const inp = document.createElement("input");
    inp.type = "text";
    inp.inputMode = "numeric";
    inp.className = "editor";
    inp.value = get();
    editor = inp;
    el.parentElement.appendChild(inp);
    inp.focus();
    inp.select();
    inp.addEventListener("keydown", ev => {
      if (ev.key === "Enter") closeEditor(true);
      else if (ev.key === "Escape") closeEditor(false);
    });
    inp.addEventListener("blur", () => closeEditor(true));
  }
  function closeEditor(commit) {
    if (!editor) return;
    const inp = editor;
    editor = null;
    const v = parseInt(inp.value, 10);
    inp.remove();
    if (commit && Number.isFinite(v)) set(v);
  }

  el.addEventListener("click", e => {
    const item = e.target.closest(".item");
    if (!item) return;
    const i = Array.prototype.indexOf.call(items, item);
    if (i === curIdx) openEditor();
    else el.scrollTo({ top: i * rowH, behavior: "smooth" });
  });

  el.addEventListener("scroll", onScroll, { passive: true });
  if ("onscrollend" in el) {
    el.addEventListener("scrollend", settle);
  } else {
    let t;
    el.addEventListener("scroll", () => { clearTimeout(t); t = setTimeout(settle, 120); }, { passive: true });
  }

  set(opts.value);
  return { get, set };
}

/* ---------- app ---------- */
let ready = false;
const app = $("#app"), costEl = $("#cost"), subEl = $("#sub"),
      cover = $("#cover"), thumb = $("#thumb");

const wheels = {
  servings: buildWheel($("#w-serv"), { min: 1,  max: 500,   step: 1,  value: 8,   onChange: render }),
  calories: buildWheel($("#w-cal"),  { min: 20, max: 10000, step: 10, value: 250, onChange: render }),
  dollars:  buildWheel($("#w-dol"),  { min: 0,  max: 300,   step: 1,  value: 4,   onChange: render }),
  cents:    buildWheel($("#w-cen"), { min: 0,  max: 90,   step: 10,  value: 0,   loop: true,
                                       format: v => String(v).padStart(2, "0"),  onChange: render }),
  protein:  buildWheel($("#w-pro"),  { min: 0, max: 300,   step: 1,  value: 10,  onChange: render }),
  carbs:    buildWheel($("#w-carb"), { min: 0, max: 300,   step: 1,  value: 30,  onChange: render }),
  fat:      buildWheel($("#w-fat"),  { min: 0, max: 300,   step: 1,  value: 10,  onChange: render }),
  mservings: buildWheel($("#w-mserv"), { min: 1, max: 500, step: 1,  value: 8,   onChange: render }),
  mdollars:  buildWheel($("#w-mdol"),  { min: 0, max: 300, step: 1,  value: 4,   onChange: render }),
  mcents:    buildWheel($("#w-mcen"),  { min: 0, max: 90,  step: 10, value: 0,   loop: true,
                                         format: v => String(v).padStart(2, "0"), onChange: render }),
};

/* ---------- macro split sliders ---------- */
const split = { p: 30, c: 35, f: 35 };
const sliders = { p: $("#s-p"), c: $("#s-c"), f: $("#s-f") };

// cyclic compensation: protein <-> carbs <-> fat <-> protein
const nextOf = { p: "c", c: "f", f: "p" };
function setSplit(changed, val) {
  const partner = nextOf[changed];
  const third = ["p", "c", "f"].find(k => k !== changed && k !== partner);
  val = Math.max(0, Math.min(100 - split[third], val)); // partner floor: 0
  split[changed] = val;
  split[partner] = 100 - val - split[third];
}

for (const k of ["p", "c", "f"]) {
  sliders[k].addEventListener("input", () => { setSplit(k, +sliders[k].value); render(); });
}

function render() {
  if (!ready) return;
  renderCalorie();
  renderMacro();
}

function renderMacro() {
  const gramsPerCal = { p: 4, c: 4, f: 9 };
  for (const k of ["p", "c", "f"]) {
    sliders[k].value = Math.round(split[k]);
    $("#l-" + k).textContent = Math.round(split[k]) + "%";
    $("#g-" + k).textContent = Math.round(2000 * split[k] / 100 / gramsPerCal[k]) + "g";
  }

  const r = usefulCost(
    { p: wheels.protein.get(), c: wheels.carbs.get(), f: wheels.fat.get() },
    wheels.mservings.get(), wheels.mdollars.get(), wheels.mcents.get(), split);
  const mcost = $("#mcost"), msub = $("#msub");

  if (!r) {
    mcost.textContent = "$—";
    mcost.style.color = "var(--muted)";
    msub.textContent = "per 2,000 useful cal";
    return;
  }
  mcost.textContent = "$" + r.cost.toFixed(2);
  mcost.style.color = r.cost < 2.5 ? "var(--green)" : r.cost < 8 ? "var(--orange)" : "var(--red)";
  msub.textContent = `per 2,000 useful cal \u00b7 ${Math.round(r.frac * 100)}% useful \u00b7 ${r.cal.toLocaleString()} cal/serving`;
}

function renderCalorie() {
  const s = wheels.servings.get(), c = wheels.calories.get();
  const d = wheels.dollars.get(),  ce = wheels.cents.get();
  const cost = costPer2000(s, c, d, ce);

  if (cost === null) {
    costEl.textContent = "$—";
    subEl.textContent = "per 2,000 cal";
    app.dataset.zone = "orange";
    cover.style.width = "100%";
    thumb.style.left = "0%";
    return;
  }

  const txt = "$" + cost.toFixed(2);
  costEl.textContent = txt;
  costEl.classList.toggle("long", txt.length > 7);
  subEl.textContent = `per 2,000 cal \u00b7 ${(s * c).toLocaleString()} cal per package`;

  app.dataset.zone = cost < 2.5 ? "green" : cost < 8 ? "orange" : "red";
  const pct = Math.min(cost / 10, 1) * 100;
  cover.style.width = (100 - pct) + "%";
  thumb.style.left = pct + "%";
}

ready = true;
render();

/* ---------- self test ---------- */
(function selfTest() {
  const eq = (a, b) => Math.abs(a - b) < 0.005;
  const t = {
    specExample: eq(costPer2000(15, 120, 5, 0), 5.56),   // 2000/1800*5
    zeroGuard:   costPer2000(0, 120, 5, 0) === null,
    centsOnly:   eq(costPer2000(1, 20, 0, 5), 5.00),      // 2000/20*0.05
    overMax:     eq(costPer2000(1, 100, 0, 70), 14.00),   // pegs bar, shows $14.00
  };
  const sp = { p: 30, c: 35, f: 35 };
  const perfect = usefulCost({ p: 15, c: 17.5, f: 70 / 9 }, 1, 1, 0, sp); // 200 cal, exact split
  const carbOnly = usefulCost({ p: 0, c: 50, f: 0 }, 1, 1, 0, sp);        // useful = 35%
  Object.assign(t, {
    perfectFrac:  eq(perfect.frac, 1),
    perfectCost:  eq(perfect.cost, 10.00),                 // = costPer2000(1, 200, 1, 0)
    carbOnlyCost: eq(carbOnly.cost, 2000 / 70),            // $1 / (35% of 200 cal)
    scaleInvar:   eq(usefulCost({ p: 10, c: 30, f: 10 }, 4, 8, 0, sp).cost,
                     usefulCost({ p: 10, c: 30, f: 10 }, 1, 2, 0, sp).cost),
    macroZero:    usefulCost({ p: 0, c: 0, f: 0 }, 1, 1, 0, sp) === null,
  });
  const fails = Object.entries(t).filter(([, ok]) => !ok);
  if (fails.length) console.error("selfTest FAILED:", fails.map(([k]) => k));
  else console.log("selfTest passed");
})();
</script>
</body>
</html>
